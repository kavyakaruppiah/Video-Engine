<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Engine</title><link rel="stylesheet" href="/style.css"></head><body><header><b>▶ Video Engine</b><div><select id="projects" aria-label="Open saved project"><option value="">Open project…</option></select><input id="projectName" value="My video project" aria-label="Project name"><button id="newProject">New project</button><button id="export" disabled>Export MP4</button></div></header><main><aside><h3>MEDIA LIBRARY</h3><input id="files" type="file" multiple accept="video/*,audio/*" disabled><div id="media">Create or open a project to begin.</div></aside><section><div id="preview">Create or open a project, then import a video.</div><div class="prompt"><textarea id="prompt" placeholder="Describe an edit, e.g. trim from 2 to 8 and make it vertical"></textarea><button id="plan">Plan edit</button></div><pre id="planView" aria-live="polite"></pre><h3>Timeline <button id="undo">Undo</button> <button id="redo">Redo</button> <button id="delete">Delete selected</button></h3><div id="timeline"></div></section><aside><h3>INSPECTOR</h3><div id="inspector">Select media to inspect.</div><label>Preserve audio <input id="audio" type="checkbox" checked></label><p id="status" role="status"></p></aside></main><script src="/app.js"></script></body></html>
